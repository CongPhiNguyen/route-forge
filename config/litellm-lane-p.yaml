# Lane P. Not started by Compose in this slice. One OpenAI deployment, no retries, no fallback.
# The runner refuses this file unless ROUTEFORGE_ALLOW_PAID=1 and the hash matches,
# and this slice still does not send the request.

model_list:
  - model_name: lab-chat
    litellm_params:
      model: openai/gpt-4.1-mini-2025-04-14
      api_key: os.environ/OPENAI_API_KEY
      timeout: 30
      # Router num_retries does not clear the OpenAI client default of 2.
      # See docs/plan/litellm-v1.104.2-validation.md.
      max_retries: 0
    model_info:
      id: lane-p-openai
      base_model: gpt-4.1-mini-2025-04-14

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 0
  allowed_fails: 2
  cooldown_time: 30
  fallbacks: []

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    db: 1
    mode: default_off
    namespace: routeforge-lane-p
    ttl: 3600
  drop_params: true
  store_prompts_in_spend_logs: false
  num_retries: 0
  request_timeout: 30

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  forward_client_headers_to_llm_api: true
  store_model_in_db: false
